<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="{{styleUri}}">
</head>
<body>
    <div id="toolbar" class="toolbar">
        <div class="toolbar-item">
            <label class="switch">
                <input type="checkbox" id="showInjections">
                <span class="slider round"></span>
            </label>
            <span class="toolbar-label">Show System & Injections</span>
        </div>

        <div class="toolbar-item">
            <div class="framing-selector">
                <span id="framingName" title="Click to change framing">Default Framing</span>
                <div id="revertFramingBtn" class="icon-btn revert-icon" title="Revert to model defaults" style="display: none;">
                </div>
            </div>
        </div>
    </div>

    <div class="messages-container" id="messages">
        <div id="loadMoreContainer" style="text-align: center; padding: 10px; display: none;">
            <button id="loadMoreBtn">Load older messages</button>
        </div>
    </div>
    
    <div class="input-area" id="inputArea">
        <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" />
        <button id="sendBtn">Send</button>
        <button id="cancelBtn" style="display: none;">Cancel</button>
        <button id="moreActionsBtn" class="icon-btn more-actions-icon" title="More Actions">
        </button>
    </div>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Message Info</h3>
                <button id="close-modal-btn" class="icon-btn">&times;</button>
            </div>
            <div id="modal-content" class="modal-body">
                <!-- Metadata will be injected here -->
            </div>
        </div>
    </div>

    <script src="{{scriptUri}}"></script>
</body>
</html>
