<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="{{styleUri}}">
</head>
<body>
    <div id="toolbar" class="toolbar">
        <div class="toolbar-item">
            <label class="switch">
                <input type="checkbox" id="showInjections">
                <span class="slider round"></span>
            </label>
            <span class="toolbar-label">Show System & Injections</span>
        </div>

        <div class="toolbar-item">
            <div class="framing-selector">
                <span id="framingName" title="Click to change framing">Default Framing</span>
                <div id="revertFramingBtn" title="Revert to model defaults" style="display: none;">
                    <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M8 2a6 6 0 1 0 6 6 6 6 0 0 0-6-6zm0 11a5 5 0 1 1 5-5 5 5 0 0 1-5 5zm2.5-7.5L9 7l1.5 1.5-1 1L8 8l-1.5 1.5-1-1L7 7 5.5 5.5l1-1L8 6l1.5-1.5z"/>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <div class="messages-container" id="messages">
        <div id="loadMoreContainer" style="text-align: center; padding: 10px; display: none;">
            <button id="loadMoreBtn">Load older messages</button>
        </div>
    </div>
    
    <div class="input-area" id="inputArea">
        <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off" />
        <button id="sendBtn">Send</button>
        <button id="cancelBtn" style="display: none;">Cancel</button>
        <button id="moreActionsBtn" title="More Actions">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <path d="M3 9.5a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm5 0a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/>
            </svg>
        </button>
    </div>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Message Info</h3>
                <button id="close-modal-btn" class="icon-btn">&times;</button>
            </div>
            <div id="modal-content" class="modal-body">
                <!-- Metadata will be injected here -->
            </div>
        </div>
    </div>

    <script src="{{scriptUri}}"></script>
</body>
</html>
