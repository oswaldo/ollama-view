<details open>
    <summary>Prompt Configuration</summary>
    <div class="section-content">
        <div class="form-group">
            <label for="system-message">System Prompt</label>
            <p class="help-text">Core instructions that define the assistant's persona and behavior.</p>
            <textarea id="system-message" rows="6" placeholder="e.g. You are a helpful assistant..."></textarea>
        </div>

        <div class="form-group">
            <label for="user-prefix">User Message Prefix</label>
            <p class="help-text">Text injected <strong>before</strong> every user message.</p>
            <textarea id="user-prefix" rows="2" placeholder="e.g. User said:"></textarea>
        </div>
        <div class="form-group">
            <label for="user-suffix">User Message Suffix</label>
            <p class="help-text">Text injected <strong>after</strong> every user message.</p>
            <textarea id="user-suffix" rows="2" placeholder=""></textarea>
        </div>

        <div class="form-group">
            <label for="system-turn-prefix">System Prefix Turn</label>
            <p class="help-text">Separate system message turn sent <strong>before</strong> the user message.</p>
            <textarea id="system-turn-prefix" rows="2" placeholder="e.g. [Reminder: Be concise]"></textarea>
        </div>
        <div class="form-group">
            <label for="system-turn-suffix">System Suffix Turn</label>
            <p class="help-text">Separate system message turn sent <strong>after</strong> the user message.</p>
            <textarea id="system-turn-suffix" rows="2" placeholder=""></textarea>
        </div>
    </div>
</details>
